name: visa-bot

on:
  schedule:
    # Every 6 hours a run starts and checks every ~10 min for ~5h35m.
    # The 12:00 UTC run (07:00 Lima) also posts the daily summary to Slack.
    - cron: "0 0,6,18 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "loop = keep watching | once = single check | test = Slack test message"
        default: once
        type: choice
        options: [once, test, loop]

concurrency:
  group: visa-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      VISA_EMAIL: ${{ secrets.VISA_EMAIL }}
      VISA_PASSWORD: ${{ secrets.VISA_PASSWORD }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SCHEDULE_ID: ${{ vars.SCHEDULE_ID }}
      CURRENT_APPOINTMENT_DATE: ${{ vars.CURRENT_APPOINTMENT_DATE }}
      COUNTRY_CODE: ${{ vars.COUNTRY_CODE }}
      CHECK_INTERVAL_MINUTES: ${{ vars.CHECK_INTERVAL_MINUTES }}
      MAX_RUNTIME_MINUTES: "335"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run bot
        run: |
          case "${{ inputs.mode || 'loop' }}" in
            test) python bot.py --test ;;
            once) python bot.py --once ;;
            # Manual loop runs and the daily 12:00 UTC run post the first check's status
            *)    python bot.py ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 12 * * *') && '--report' || '' }} ;;
          esac
