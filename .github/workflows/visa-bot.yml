name: visa-bot

on:
  schedule:
    # Every 6 hours a run starts and checks every ~10 min for ~5h35m.
    # The 12:00 UTC run (07:00 Lima) also posts the daily summary to Slack.
    - cron: "0 0,6,18 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "loop = keep watching | once = single check | test = Slack test message"
        default: once
        type: choice
        options: [once, test, loop]

permissions:
  contents: write  # push the check history to the `stats` branch

concurrency:
  group: visa-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      VISA_EMAIL: ${{ secrets.VISA_EMAIL }}
      VISA_PASSWORD: ${{ secrets.VISA_PASSWORD }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SCHEDULE_ID: ${{ vars.SCHEDULE_ID }}
      CURRENT_APPOINTMENT_DATE: ${{ vars.CURRENT_APPOINTMENT_DATE }}
      COUNTRY_CODE: ${{ vars.COUNTRY_CODE }}
      CHECK_INTERVAL_MINUTES: ${{ vars.CHECK_INTERVAL_MINUTES }}
      STATUS_EVERY_MINUTES: ${{ vars.STATUS_EVERY_MINUTES }}
      MAX_RUNTIME_MINUTES: "335"
      HISTORY_FILE: stats/history.csv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Load check history
        run: |
          if git fetch --depth=1 origin stats; then
            git worktree add stats FETCH_HEAD
          else
            git worktree add --orphan -b stats stats
          fi
      - name: Run bot
        run: |
          case "${{ inputs.mode || 'loop' }}" in
            test) python bot.py --test ;;
            once) python bot.py --once ;;
            # Manual loop runs and the daily 12:00 UTC run post the first check's status
            *)    python bot.py ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 12 * * *') && '--report' || '' }} ;;
          esac
      - name: Save check history
        if: always()
        working-directory: stats
        run: |
          [ -f history.csv ] || exit 0
          git add history.csv
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com"             commit -q -m "Update check history"
          git push origin HEAD:stats
